name: Upload til Simply
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byg siderne
        run: |
          if [ -f build.py ]; then
            echo "build.py fundet — genererer sider"
            python3 build.py
          else
            echo "Ingen build.py — uploader HTML som den ligger i repoet"
          fi
          echo "--- sider der uploades ---"
          find . -name '*.html' -not -path './.git/*' | sort
          echo "--- billeder der uploades ---"
          ls -la bilder/ 2>/dev/null || echo "INGEN bilder-mappe i repoet"
      - name: Upload med lftp
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BRUGER: ${{ secrets.FTP_USERNAME }}
          KODE: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 6;
            set net:timeout 120;
            set net:reconnect-interval-base 20;
            set net:reconnect-interval-multiplier 1.5;
            set mirror:parallel-directories false;
            set mirror:parallel-transfer-count 1;
            open -u '$BRUGER','$KODE' '$SERVER';
            mirror --reverse --only-newer --continue --verbose=1 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob __pycache__/ \
              --exclude-glob '*.md' \
              --exclude-glob '*.py' \
              ./ public_html/;
          "
      - name: Færdig
        run: echo "Udrullet til https://bilforsakringspriser.se/"
